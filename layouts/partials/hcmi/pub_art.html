{{- $i := . | int -}}
{{- $variant := mod $i 5 -}}
{{- if eq $variant 0 -}}
<svg class="pubs-art" viewBox="0 0 220 110" fill="none" aria-hidden="true">
  <circle cx="88" cy="58" r="36" stroke="#B38A43" stroke-width="1.4"/>
  <circle cx="128" cy="58" r="36" stroke="#B38A43" stroke-width="1.4"/>
  <circle cx="88" cy="58" r="4" fill="#B38A43"/>
  <circle cx="128" cy="58" r="4" fill="#B38A43"/>
  <circle cx="108" cy="58" r="3.2" fill="#665037"/>
</svg>
{{- else if eq $variant 1 -}}
<svg class="pubs-art" viewBox="0 0 220 110" fill="none" aria-hidden="true">
  <path d="M18 86 C58 86, 70 38, 108 38 C146 38, 156 78, 202 78" stroke="#C9C2B5" stroke-width="1.5" fill="none"/>
  <circle cx="48" cy="78" r="10" stroke="#C9C2B5" stroke-width="1.2" fill="#F7F5F0"/>
  <circle cx="108" cy="38" r="11" stroke="#B38A43" stroke-width="1.2" fill="#EEEAE1"/>
  <circle cx="168" cy="72" r="12" stroke="#B38A43" stroke-width="1.2" fill="#EEEAE1"/>
  <text x="48" y="82" text-anchor="middle" font-size="7" fill="#7A7368" font-family="Inter, sans-serif">Input</text>
  <text x="168" y="76" text-anchor="middle" font-size="6.5" fill="#7A7368" font-family="Inter, sans-serif">Explanation</text>
</svg>
{{- else if eq $variant 2 -}}
<svg class="pubs-art" viewBox="0 0 220 110" fill="none" aria-hidden="true">
  <path d="M20 86 L20 28 L206 28" stroke="#D8D2C6" stroke-width="1"/>
  <path d="M28 74 C60 70, 78 58, 102 52 C128 46, 146 62, 172 40 C188 28, 198 36, 206 32" stroke="#B38A43" stroke-width="1.6" fill="none"/>
  <path d="M28 82 C64 76, 86 68, 112 64 C140 60, 158 70, 206 48" stroke="#D8D2C6" stroke-width="1.3" fill="none"/>
</svg>
{{- else if eq $variant 3 -}}
<svg class="pubs-art" viewBox="0 0 220 110" fill="none" aria-hidden="true">
  {{- range seq 0 22 -}}
    <circle cx="{{ add 24 (mul (mod . 8) 24) }}" cy="{{ add 28 (mul (div . 8) 26) }}" r="{{ cond (eq (mod . 5) 0) 3.4 2.2 }}" fill="#B38A43" opacity="{{ cond (eq (mod . 4) 0) 0.95 0.45 }}"/>
  {{- end -}}
</svg>
{{- else -}}
<svg class="pubs-art" viewBox="0 0 220 110" fill="none" aria-hidden="true">
  <circle cx="70" cy="42" r="12" stroke="#C9C2B5" stroke-width="1.3"/>
  <circle cx="118" cy="36" r="10" stroke="#C9C2B5" stroke-width="1.3"/>
  <circle cx="156" cy="58" r="12" stroke="#C9C2B5" stroke-width="1.3"/>
  <circle cx="92" cy="78" r="11" stroke="#C9C2B5" stroke-width="1.3"/>
  <circle cx="136" cy="86" r="9" stroke="#C9C2B5" stroke-width="1.3"/>
  <path d="M70 42 L118 36 L156 58 L136 86 L92 78 Z" stroke="#C9C2B5" stroke-width="1" opacity="0.8"/>
  <circle cx="70" cy="38" r="2.4" fill="#B38A43"/>
  <circle cx="118" cy="32" r="2.4" fill="#B38A43"/>
  <circle cx="156" cy="54" r="2.4" fill="#B38A43"/>
</svg>
{{- end -}}
